# Build, test and smoke-test the plugin against a real Jenkins.
#
# The repository had no GitHub Actions at all: the Jenkinsfile targets
# ci.jenkins.io, which builds the jenkinsci/ repository and never runs here, so
# pull requests to this fork were merged without anything being compiled.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Unit and integration tests. The matrix mirrors the Jenkinsfile so the two
  # cannot drift: same JDK, same platforms.
  #
  # The Ubuntu image is pinned rather than `ubuntu-latest`: that label moves to
  # Ubuntu 26 from 2026-10-19, and the e2e job below builds and runs containers
  # on it, so the image is part of what is being tested. Bumping it is a
  # deliberate commit that CI proves, not a silent change under a green build.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.jdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            jdk: 21
          - os: windows-latest
            jdk: 21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Kept for humans to download a build of a pull request. The e2e job
      # packages its own copy so it does not have to wait for this matrix.
      - name: Upload the plugin
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hpi
          path: target/*.hpi
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-${{ matrix.os }}-${{ matrix.jdk }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # End-to-end against a real Jenkins.
  #
  # The test harness runs an in-JVM Jenkins with the plugin on the classpath,
  # which is not the same thing as a released .hpi being installed into a stock
  # distribution: it does not exercise plugin packaging, dependency resolution
  # from the update centre, or the Jelly views as an installed plugin renders
  # them. Everything this job asserts is a thing a user would notice and the
  # unit tests would not.
  #
  # It packages the plugin itself rather than waiting for the test job's
  # artifact. `needs: test` waited for the whole matrix, so the slowest leg
  # (windows) was on this job's critical path even though it produces nothing
  # this job uses -- roughly a minute of wall clock spent waiting. Packaging
  # here costs about twenty seconds against a warm Maven cache and runs in
  # parallel with the tests instead of after them.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (real Jenkins)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Package the plugin
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests package
          cp target/*.hpi .github/e2e/deploy-dashboard.hpi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image's expensive layer is jenkins-plugin-cli resolving the
      # plugin's dependencies from the update centre, which is the same work
      # every run until the Dockerfile or the base image changes. Cached
      # through the Actions cache so it is done once rather than each time.
      #
      # This does mean the resolved plugin set can be up to a week old (the
      # Actions cache evicts unused entries) instead of resolved fresh every
      # run. Moving the jenkins/jenkins:lts-jdk21 tag still invalidates it, so
      # a new LTS is picked up immediately; only plugin releases within one
      # base image can lag.
      - name: Build a stock Jenkins with the plugin installed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/e2e
          load: true
          tags: dd-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        run: docker run -d --name jenkins -p 8080:8080 dd-e2e

      # Polled every two seconds rather than five: Jenkins answers after about
      # fifteen, so the coarser interval spent several seconds of every run
      # waiting on a container that was already up.
      - name: Wait for Jenkins to come up
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            if curl -fsS http://localhost:8080/login >/dev/null 2>&1; then
              echo "Jenkins answered after $((i * 2))s"
              # The seed script runs during startup; give it a moment to finish
              # creating the job and the view before anything asks for them.
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo "::error::Jenkins did not start within 5 minutes"
          docker logs jenkins
          exit 1

      - name: The plugin is installed and active
        run: python3 .github/e2e/check_installed.py

      - name: Run the seeded pipeline and assert the dashboard
        run: .github/e2e/assert.sh

      - name: Jenkins log on failure
        if: failure()
        run: docker logs jenkins
